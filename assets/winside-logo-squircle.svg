<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="squircleBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232832" />
      <stop offset="50%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <!-- Specular Top Highlight Border -->
    <linearGradient id="borderSpecular" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#60CDFF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#60CDFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#80D8FF" />
      <stop offset="35%" stop-color="#40B9FF" />
      <stop offset="75%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#005A9E" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0078D4" flood-opacity="0.25" />
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#60CDFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#squircleBg)" filter="url(#squircleShadow)" />

  <!-- Center Backlight Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#centerGlow)" />

  <!-- Inner Lighting Border -->
  <rect x="24.5" y="24.5" width="463" height="463" rx="103.5" stroke="url(#borderSpecular)" stroke-width="1.5" />

  <!-- Icon Centered (Scaled to 65%) -->
  <g transform="translate(90, 90) scale(0.65)" filter="url(#iconShadow)">
    <path fill="url(#iconGrad)" d="M20.916 15.648c147.945 202 202.556 312.645-3.146 252.438 201.76 82.926 225.515 176.51 49.13 180.76 190.922 51.156 315.057 60.258 377.16 10.43 67.76-54.368 62.6-177.648 13.31-361.6-.002 179.943-88.34 149.935-171.18-39.96 60.246 191.39-81.408 116.353-265.274-42.068zM457.37 97.676v-.008.008zm-79.792 150.84c5.457.054 10.994.79 16.508 2.267 3.763 1.01 7.352 2.34 10.77 3.924-.053-.058-.102-.12-.155-.178 51.248 21.08 79.986 77.264 65.253 132.25-16.008 59.742-77.174 95.054-136.914 79.046-59.29-15.886-94.507-76.24-79.395-135.547 1.144 7.843 3.71 15.465 7.808 22.564 15.038 26.045 46.48 37.745 78.735 32.334 8.387-.382 17.33-2.932 25.75-7.793 22.18-12.807 32.317-36.774 22.642-53.53-9.676-16.76-35.5-19.966-57.682-7.16-7.3 4.214-13.283 9.64-17.697 15.618-3.05-11-3.31-22.928-.14-34.75 7.978-29.778 35.053-49.34 64.518-49.047z"/>
  </g>
</svg>
