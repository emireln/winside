<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12151B" />
      <stop offset="50%" stop-color="#161A22" />
      <stop offset="100%" stop-color="#0D0F14" />
    </linearGradient>

    <!-- Radial Ambient Lighting -->
    <radialGradient id="ambientCyan" cx="640" cy="210" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#60CDFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerAmbientLeft" cx="150" cy="50" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60CDFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#12151B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerAmbientRight" cx="1150" cy="370" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#005A9E" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D0F14" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>

    <!-- Logo Squircle Base Gradient -->
    <linearGradient id="logoBg" x1="530" y1="100" x2="750" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242934" />
      <stop offset="50%" stop-color="#1A1E27" />
      <stop offset="100%" stop-color="#101217" />
    </linearGradient>

    <!-- Specular Border Highlight -->
    <linearGradient id="logoBorder" x1="640" y1="100" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#60CDFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGradient" x1="560" y1="130" x2="720" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#80D8FF" />
      <stop offset="40%" stop-color="#40B9FF" />
      <stop offset="80%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#005A9E" />
    </linearGradient>

    <!-- Shadows & Glows -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="36" flood-color="#0078D4" flood-opacity="0.4" />
    </filter>

    <filter id="iconGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#60CDFF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Banner Background Surface -->
  <rect width="1280" height="420" fill="url(#bannerBg)" />
  <rect width="1280" height="420" fill="url(#cornerAmbientLeft)" />
  <rect width="1280" height="420" fill="url(#cornerAmbientRight)" />
  <rect width="1280" height="420" fill="url(#ambientCyan)" />
  <rect width="1280" height="420" fill="url(#dotGrid)" />

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1279" height="419" rx="0" stroke="#FFFFFF" stroke-opacity="0.08" fill="none" />

  <!-- Centered Squircle Logo (220x220 at (530, 100)) -->
  <g filter="url(#logoShadow)">
    <rect x="530" y="100" width="220" height="220" rx="52" fill="url(#logoBg)" />
    <rect x="530.5" y="100.5" width="219" height="219" rx="51.5" stroke="url(#logoBorder)" stroke-width="1.5" fill="none" />
    
    <!-- Icon Inside Logo -->
    <g transform="translate(566, 136) scale(0.289)" filter="url(#iconGlowFilter)">
      <path fill="url(#iconGradient)" d="M20.916 15.648c147.945 202 202.556 312.645-3.146 252.438 201.76 82.926 225.515 176.51 49.13 180.76 190.922 51.156 315.057 60.258 377.16 10.43 67.76-54.368 62.6-177.648 13.31-361.6-.002 179.943-88.34 149.935-171.18-39.96 60.246 191.39-81.408 116.353-265.274-42.068zM457.37 97.676v-.008.008zm-79.792 150.84c5.457.054 10.994.79 16.508 2.267 3.763 1.01 7.352 2.34 10.77 3.924-.053-.058-.102-.12-.155-.178 51.248 21.08 79.986 77.264 65.253 132.25-16.008 59.742-77.174 95.054-136.914 79.046-59.29-15.886-94.507-76.24-79.395-135.547 1.144 7.843 3.71 15.465 7.808 22.564 15.038 26.045 46.48 37.745 78.735 32.334 8.387-.382 17.33-2.932 25.75-7.793 22.18-12.807 32.317-36.774 22.642-53.53-9.676-16.76-35.5-19.966-57.682-7.16-7.3 4.214-13.283 9.64-17.697 15.618-3.05-11-3.31-22.928-.14-34.75 7.978-29.778 35.053-49.34 64.518-49.047z"/>
    </g>
  </g>
</svg>
